<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1400" width="1560" height="1400" role="img" aria-labelledby="title desc">
  <title id="title">yolo-dag workflow</title>
  <desc id="desc">brainstorm resolves ambiguity and hands off to the orchestrator, which routes the request to the relevant domain specialists, runs a bounded adversarial review loop per specialist, merges their deliverables and reconciles contradictions between them into one build spec, decomposes it into a task DAG, executes that DAG in topological waves of worktree-isolated workers, and integrates the finished worktrees onto a single branch.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#726d7d"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fb0a6"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2a33f"/>
    </marker>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1560" height="1400" fill="#1c1a20"/>

  <!-- Stage A: brainstorm -->
  <rect x="650" y="40" width="260" height="76" rx="14" fill="#242229" stroke="#e2a33f" stroke-width="2" filter="url(#soft)"/>
  <text x="780" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#e2a33f">/brainstorm</text>
  <text x="780" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9d978c">entrypoint &#183; resolves ambiguity</text>

  <line x1="780" y1="116" x2="780" y2="150" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 1a: route -->
  <rect x="600" y="152" width="360" height="76" rx="14" fill="#242229" stroke="#726d7d" stroke-width="1.5" filter="url(#soft)"/>
  <text x="780" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#ece7dc">route</text>
  <text x="780" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">select only the specialists whose domain applies</text>

  <!-- Fan-out lines -->
  <line x1="780" y1="228" x2="780" y2="252" stroke="#726d7d" stroke-width="2"/>
  <text x="780" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#9d978c">fan-out &#8594; selected specialists in parallel</text>
  <line x1="125.5" y1="252" x2="1434.5" y2="252" stroke="#726d7d" stroke-width="2"/>
  <line x1="125.5" y1="252" x2="125.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="312.5" y1="252" x2="312.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="499.5" y1="252" x2="499.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686.5" y1="252" x2="686.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="873.5" y1="252" x2="873.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060.5" y1="252" x2="1060.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1247.5" y1="252" x2="1247.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1434.5" y1="252" x2="1434.5" y2="292" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8 specialist chips: solid gold = always routed, dashed = routed only when relevant -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ece7dc" text-anchor="middle">
    <g filter="url(#soft)">
      <rect x="40" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#4a4653" stroke-width="1.25" stroke-dasharray="5 4"/>
      <rect x="227" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#e2a33f" stroke-width="1.5"/>
      <rect x="414" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#e2a33f" stroke-width="1.5"/>
      <rect x="601" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#4a4653" stroke-width="1.25" stroke-dasharray="5 4"/>
      <rect x="788" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#e2a33f" stroke-width="1.5"/>
      <rect x="975" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#4a4653" stroke-width="1.25" stroke-dasharray="5 4"/>
      <rect x="1162" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#4a4653" stroke-width="1.25" stroke-dasharray="5 4"/>
      <rect x="1349" y="294" width="171" height="64" rx="10" fill="#2c2a33" stroke="#4a4653" stroke-width="1.25" stroke-dasharray="5 4"/>
    </g>
    <text x="125.5" y="331">Design</text>
    <text x="312.5" y="331">Architecture</text>
    <text x="499.5" y="331">Research</text>
    <text x="686.5" y="331">Security</text>
    <text x="873.5" y="331">Test Planning</text>
    <text x="1060.5" y="331">Cost Estimation</text>
    <text x="1247.5" y="331">UX Copy</text>
    <text x="1434.5" y="331">Data &amp; Schema</text>
  </g>

  <!-- Fan-in to review band -->
  <line x1="125.5" y1="358" x2="125.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="312.5" y1="358" x2="312.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="499.5" y1="358" x2="499.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686.5" y1="358" x2="686.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="873.5" y1="358" x2="873.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060.5" y1="358" x2="1060.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1247.5" y1="358" x2="1247.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1434.5" y1="358" x2="1434.5" y2="396" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: review loop band -->
  <rect x="40" y="398" width="1480" height="140" rx="16" fill="#26242c" stroke="#5fb0a6" stroke-width="2" stroke-dasharray="7 6" filter="url(#soft)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="438" font-size="16" font-weight="600" fill="#ece7dc">adversarial review, per specialist</text>
    <text x="80" y="462" font-size="13" fill="#9d978c">3 independent reviewers + 1 consolidator per round</text>
    <text x="80" y="482" font-size="13" fill="#9d978c">specialist accepts valid findings, pushes back on the rest</text>
    <text x="80" y="502" font-size="13" fill="#9d978c">closes early when all 3 reviewers report clean</text>
  </g>
  <path d="M1369.9 476.7 A26 26 0 1 1 1369.9 443.3" stroke="#5fb0a6" stroke-width="3" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="1350" y="504" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5fb0a6">up to 3 rounds</text>

  <!-- Fan-in / merge -->
  <line x1="780" y1="538" x2="780" y2="566" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="556" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#9d978c">fan-in</text>

  <!-- Phase 3a: merge -->
  <rect x="630" y="568" width="300" height="76" rx="14" fill="#242229" stroke="#726d7d" stroke-width="1.5" filter="url(#soft)"/>
  <text x="780" y="602" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#ece7dc">merge</text>
  <text x="780" y="626" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">deliverables &#8594; one build spec (+ open concerns)</text>

  <line x1="780" y1="644" x2="780" y2="682" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3b: reconcile -->
  <rect x="590" y="684" width="380" height="90" rx="14" fill="#242229" stroke="#5fb0a6" stroke-width="1.75" filter="url(#soft)"/>
  <text x="780" y="716" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#5fb0a6">spec-reconciler</text>
  <text x="780" y="738" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">the only agent that sees every deliverable at once</text>
  <text x="780" y="758" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">catches contradictions between specialists</text>

  <line x1="780" y1="774" x2="780" y2="812" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: task decomposition -->
  <rect x="590" y="814" width="380" height="76" rx="14" fill="#242229" stroke="#726d7d" stroke-width="1.5" filter="url(#soft)"/>
  <text x="780" y="846" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#ece7dc">task-specialist</text>
  <text x="780" y="870" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">decompose spec &#8594; task DAG with dependency edges</text>

  <line x1="780" y1="890" x2="780" y2="928" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 5: execute & verify, wave by wave -->
  <rect x="340" y="930" width="880" height="200" rx="16" fill="#26242c" stroke="#5fb0a6" stroke-width="2" stroke-dasharray="7 6" filter="url(#soft)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="380" y="970" font-size="16" font-weight="600" fill="#ece7dc">execute &amp; verify, wave by wave</text>
    <text x="380" y="994" font-size="13" fill="#9d978c">worker implements in an isolated worktree &#8594; reviewer checks criteria</text>
    <text x="380" y="1014" font-size="13" fill="#9d978c">flagged task reassigned to a fresh worker</text>
    <text x="380" y="1034" font-size="13" fill="#9d978c">a wave runs only once every dependency has landed</text>
  </g>

  <!-- wave clusters -->
  <g>
    <rect x="380" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="395" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="410" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="425" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="440" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="455" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <line x1="475" y1="1062" x2="497" y2="1062" stroke="#e2a33f" stroke-width="1.5" marker-end="url(#arrowGold)"/>
    <rect x="506" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="521" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="536" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="551" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="566" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <line x1="586" y1="1062" x2="608" y2="1062" stroke="#e2a33f" stroke-width="1.5" marker-end="url(#arrowGold)"/>
    <rect x="617" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
    <rect x="632" y="1056" width="12" height="12" rx="3" fill="none" stroke="#e2a33f" stroke-width="1.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9d978c">
    <text x="423" y="1092" text-anchor="middle">wave 0</text>
    <text x="542" y="1092" text-anchor="middle">wave 1</text>
    <text x="632" y="1092" text-anchor="middle">wave 2</text>
    <text x="690" y="1064" text-anchor="start">topological order &#183; up to 10 in parallel per wave</text>
  </g>

  <path d="M1139.9 1006.7 A26 26 0 1 1 1139.9 973.3" stroke="#5fb0a6" stroke-width="3" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="1120" y="1034" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5fb0a6">&#8804; 3 attempts</text>

  <line x1="780" y1="1130" x2="780" y2="1168" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 6: integrate -->
  <rect x="570" y="1170" width="420" height="90" rx="14" fill="#242229" stroke="#5fb0a6" stroke-width="1.75" filter="url(#soft)"/>
  <text x="780" y="1202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#5fb0a6">integrate</text>
  <text x="780" y="1224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">merge worktrees in dependency order onto dag/&lt;run-id&gt;</text>
  <text x="780" y="1244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c">then run the suite once against the assembled result</text>

  <line x1="780" y1="1260" x2="780" y2="1296" stroke="#726d7d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Done -->
  <rect x="650" y="1298" width="260" height="68" rx="14" fill="#242229" stroke="#e2a33f" stroke-width="2" filter="url(#soft)"/>
  <text x="780" y="1328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#e2a33f">done</text>
  <text x="780" y="1350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9d978c">a branch for the user to review</text>

  <!-- Legend -->
  <text x="780" y="1390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9d978c"><tspan fill="#726d7d" font-weight="700">&#8594;</tspan> one-way flow (DAG edge) &#160;&#160;&#160;&#160; <tspan fill="#5fb0a6" font-weight="700">&#8635;</tspan> bounded loop (capped rounds / attempts) &#160;&#160;&#160;&#160; <tspan fill="#e2a33f" font-weight="700">&#9633;</tspan> always routed &#160;&#160;&#160;&#160; <tspan fill="#4a4653" font-weight="700">&#9633;</tspan> routed when relevant</text>
</svg>
