name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate plugin structure (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the documented floor (meter-handoff.md 5.3); 3.12 is what's actually
        # developed against. Both run so a floor violation doesn't slip in unnoticed.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # No dependencies by design — the validator and the test suite both run on a bare
      # interpreter so this job stays fast and can't break on a transitive package update.
      - name: Validate manifests, agents, commands, and skills
        run: python3 scripts/validate.py

      - name: Run meter's unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Check JSON files parse
        run: |
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
          done
